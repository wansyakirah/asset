<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Upload CSV Dataset</title>
</head>

<body>

<h2>Upload Weather Dataset CSV</h2>

<form action="ImportServlet"
      method="post"
      enctype="multipart/form-data">

    <input type="file"
           name="csvfile"
           accept=".csv"
           required>

    <br><br>

    <input type="submit"
           value="Upload Dataset">

</form>

</body>
</html>
